
  <!DOCTYPE html>
  <html lang="en">
    <head>

      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Henry&#39;s Portfolio</title>
      <meta name="description" content="Showcases a seamless portfolio and project viewer with intuitive navigation for professionals to display and explore creative work efficiently." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <!--
        The loading screen. It is plain HTML and CSS so it shows straight away, while the app downloads;
        the app (src/app/pageLoader.ts) fills the bar as the first screen's pictures arrive, then opens it
        like an iris. When everything is already cached it only flashes the sky for a moment.
      -->
      <style>
        @property --hwl-r { syntax: "<length>"; inherits: false; initial-value: 0px; }
        #hw-loader {
          position: fixed; inset: 0; z-index: 9999; overflow: hidden;
          display: grid; place-content: center; justify-items: center; gap: 16px;
          background: radial-gradient(circle at 50% 44%, #ffffff 0%, #e6f4fc 36%, #cfe9fb 72%, #fdf3ec 130%);
          font: 700 12px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
          letter-spacing: 0.28em; color: #5b6478;
          --hwl-r: 0px;
          -webkit-mask: radial-gradient(circle at 50% 44%, transparent var(--hwl-r), #000 calc(var(--hwl-r) + 1px));
                  mask: radial-gradient(circle at 50% 44%, transparent var(--hwl-r), #000 calc(var(--hwl-r) + 1px));
          transition: --hwl-r 0.8s cubic-bezier(0.7, 0, 0.3, 1);
        }
        #hw-loader.hwl-out { --hwl-r: 150vmax; pointer-events: none; }
        #hw-loader > * { animation: hwl-in 0.45s 0.18s both cubic-bezier(0.2, 0.8, 0.2, 1); }
        .hwl-stage { position: relative; width: 168px; height: 168px; }
        .hwl-stage::before {
          content: ""; position: absolute; inset: 22%; border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 209, 102, 0.75), rgba(255, 209, 102, 0) 70%);
          animation: hwl-glow 2.2s ease-in-out infinite;
        }
        .hwl-ring { position: absolute; border-radius: 50%; }
        .hwl-ring--outer {
          inset: 0; animation: hwl-spin 7s linear infinite;
          background: repeating-conic-gradient(#ec6a4e 0 16deg, transparent 16deg 30deg);
          -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
                  mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        }
        .hwl-ring--inner {
          inset: 20px; animation: hwl-spin 4.5s linear infinite reverse;
          background: conic-gradient(#e6a400 0 22%, transparent 0 33%, #ffd166 0 55%, transparent 0 66%, #e6a400 0 88%, transparent 0);
          -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
                  mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        }
        .hwl-orbit { position: absolute; inset: -8px; animation: hwl-spin 2.6s linear infinite; }
        .hwl-orbit i {
          position: absolute; left: 50%; top: 0; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%;
          background: #ffd166; box-shadow: 0 0 10px #ffd166, 0 0 18px rgba(230, 164, 0, 0.6);
          transform-origin: 4px 92px;
        }
        .hwl-orbit i:nth-child(2) { transform: rotate(120deg); background: #ec6a4e; box-shadow: 0 0 10px #f6a68f; }
        .hwl-orbit i:nth-child(3) { transform: rotate(240deg); width: 6px; height: 6px; margin-left: -3px; transform-origin: 3px 92px; }
        .hwl-crest {
          position: absolute; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px;
          filter: drop-shadow(0 10px 18px rgba(32, 43, 69, 0.35)); animation: hwl-bob 2.2s ease-in-out infinite;
        }
        .hwl-label::after { content: ""; display: inline-block; width: 1.6em; text-align: left; animation: hwl-dots 1.2s steps(4) infinite; }
        .hwl-bar { width: 220px; height: 6px; border-radius: 99px; background: rgba(32, 43, 69, 0.1); overflow: hidden; }
        .hwl-bar span {
          display: block; height: 100%; width: 0; border-radius: inherit;
          background: linear-gradient(90deg, #ec6a4e, #e6a400); box-shadow: 0 0 10px rgba(230, 164, 0, 0.7);
          transition: width 0.35s ease-out; animation: hwl-creep 3s ease-out forwards;
        }
        .hwl-pct { font-size: 10px; letter-spacing: 0.2em; color: #8a93a6; font-variant-numeric: tabular-nums; }
        .hwl-sparks { position: absolute; inset: 0; pointer-events: none; }
        .hwl-sparks span {
          position: absolute; bottom: -10px; width: 6px; height: 6px; border-radius: 50%;
          background: #ffd166; box-shadow: 0 0 8px #ffd166; opacity: 0; animation: hwl-rise 4s linear infinite;
        }
        /* done: the crest pops and the rings speed up, just before the iris opens */
        #hw-loader.hwl-done .hwl-crest { animation: hwl-pop 0.3s ease-out forwards; }
        #hw-loader.hwl-done .hwl-ring--outer, #hw-loader.hwl-done .hwl-orbit { animation-duration: 0.6s; }
        @keyframes hwl-in { from { opacity: 0; transform: scale(0.9); } }
        @keyframes hwl-spin { to { transform: rotate(360deg); } }
        @keyframes hwl-bob { 50% { transform: translateY(-4px) scale(1.04); } }
        @keyframes hwl-glow { 50% { transform: scale(1.25); opacity: 0.7; } }
        @keyframes hwl-pop { 60% { transform: scale(1.3); } to { transform: scale(1.15); } }
        @keyframes hwl-creep { to { width: 30%; } }
        @keyframes hwl-dots { from { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
        @keyframes hwl-rise { 10% { opacity: 0.9; } 80% { opacity: 0.6; } to { transform: translateY(-70vh); opacity: 0; } }
        @media (prefers-reduced-motion: reduce) {
          #hw-loader, #hw-loader * { animation: none !important; }
          #hw-loader { transition: opacity 0.2s; }
          #hw-loader.hwl-out { opacity: 0; }
          .hwl-sparks { display: none; }
        }
      </style>
      <noscript><style>#hw-loader { display: none; }</style></noscript>
    </head>

    <body>
      <div id="hw-loader" role="status" aria-label="Loading Henry Wu's portfolio">
        <div class="hwl-sparks" aria-hidden="true">
          <span style="left: 12%; animation-delay: 0.2s"></span>
          <span style="left: 26%; animation-delay: 1.6s; width: 4px; height: 4px"></span>
          <span style="left: 41%; animation-delay: 2.7s"></span>
          <span style="left: 58%; animation-delay: 0.9s; width: 4px; height: 4px"></span>
          <span style="left: 73%; animation-delay: 2.1s"></span>
          <span style="left: 88%; animation-delay: 3.2s; width: 5px; height: 5px"></span>
        </div>
        <div class="hwl-stage" aria-hidden="true">
          <div class="hwl-ring hwl-ring--outer"></div>
          <div class="hwl-ring hwl-ring--inner"></div>
          <div class="hwl-orbit"><i></i><i></i><i></i></div>
          <svg class="hwl-crest" viewBox="0 0 32 32">
            <rect width="32" height="32" rx="7" fill="#202b45" />
            <path d="M7 6 L25 6 L25 19 Q24.5 24.5 16 28 Q7.5 24.5 7 19 Z" fill="#ec6a4e" />
            <rect x="10" y="10" width="3" height="13" fill="#fff" />
            <rect x="19" y="10" width="3" height="13" fill="#fff" />
            <rect x="10" y="16" width="12" height="3" fill="#fff" />
          </svg>
        </div>
        <p class="hwl-label" style="margin: 6px 0 0">LOADING QUEST</p>
        <div class="hwl-bar" aria-hidden="true"><span data-hwl-bar></span></div>
        <p class="hwl-pct" data-hwl-pct style="margin: 0; min-height: 1em"></p>
      </div>
      <script>
        // if the app never takes over (a failed download, a script error), don't leave the loading screen up
        setTimeout(function () {
          var l = document.getElementById("hw-loader");
          if (l && !l.dataset.state) { l.classList.add("hwl-out"); setTimeout(function () { l.remove(); }, 900); }
        }, 12000);
      </script>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>

    </body>
  </html>
